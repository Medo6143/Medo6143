<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff9d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05" fill="none"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="180" cy="80" r="260" fill="url(#glow1)">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="260" r="280" fill="url(#glow2)">
      <animate attributeName="cy" values="260;180;260" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- code window -->
    <g transform="translate(820,70)">
      <rect width="320" height="180" rx="14" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="20" r="5" fill="#ff5f57"/><circle cx="40" cy="20" r="5" fill="#febc2e"/><circle cx="58" cy="20" r="5" fill="#28c840"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
        <text x="20" y="58" fill="#c084fc">const</text><text x="64" y="58" fill="#e2e8f0">dev = {</text>
        <text x="36" y="80" fill="#38bdf8">role:</text><text x="78" y="80" fill="#00ff9d">"Full-Stack"</text><text x="168" y="80" fill="#e2e8f0">,</text>
        <text x="36" y="102" fill="#38bdf8">stack:</text><text x="86" y="102" fill="#00ff9d">["Next.js","Node","Django"]</text>
        <text x="36" y="124" fill="#38bdf8">ships:</text><text x="86" y="124" fill="#fbbf24">true</text>
        <text x="20" y="146" fill="#e2e8f0">}</text>
        <rect x="30" y="150" width="8" height="14" fill="#00ff9d"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <!-- title -->
    <text x="64" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Mohamed Wael</text>
    <text x="66" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#accent)">Full-Stack Developer</text>
    <text x="66" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Next.js · React · TypeScript · Node.js · Django · React Native</text>
    <g transform="translate(66,256)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <rect width="118" height="26" rx="13" fill="#00ff9d" fill-opacity="0.12" stroke="#00ff9d" stroke-opacity="0.5"/><text x="59" y="17" text-anchor="middle" fill="#00ff9d">Cairo · Riyadh</text>
      <rect x="128" width="150" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/><text x="203" y="17" text-anchor="middle" fill="#38bdf8">Open to freelance</text>
    </g>
  </g>
</svg>
